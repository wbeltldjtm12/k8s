# rbac.yaml
# KubeIn 백엔드가 클러스터 전체 리소스를 읽기 위한 RBAC 설정
# 현재는 docker-compose (master에서 실행) 방식이므로 필수는 아님
# 추후 백엔드를 K8s Pod로 올릴 때 사용

---
apiVersion: v1
kind: Namespace
metadata:
  name: kubein

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubein-backend
  namespace: kubein

---
# ClusterRole: 모든 네임스페이스의 리소스를 read-only로 접근
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubein-reader
rules:
  # ResourceCache가 수집하는 리소스 목록
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubein-reader-binding
subjects:
  - kind: ServiceAccount
    name: kubein-backend
    namespace: kubein
roleRef:
  kind: ClusterRole
  name: kubein-reader
  apiGroup: rbac.authorization.k8s.io
