apiVersion: chaos-mesh.org/v1alpha1
kind: DNSChaos
metadata:
  name: kubein-11-dns-error
  namespace: sock-shop
spec:
  action: error
  mode: one
  duration: 30s
  selector:
    namespaces:
      - sock-shop
    labelSelectors:
      name: shipping
      kubein-dnschaos-target: "true"
  patterns:
    - catalogue.sock-shop.svc.cluster.local
