name: Deploy monitoring

on:
  push:
    branches:
      - main
    paths:
      - "cluster-port/monitoring-values.yaml"
      - ".github/workflows/monitoring.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubein-monitoring
  cancel-in-progress: false

env:
  KUBE_PROMETHEUS_STACK_VERSION: "86.0.0"

jobs:
  deploy-monitoring:
    name: Deploy Prometheus on master
    runs-on:
      - self-hosted
      - linux
      - x64
      - kubein-master

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check cluster access
        run: |
          set -euo pipefail
          kubectl cluster-info
          helm version

      - name: Install or upgrade kube-prometheus-stack
        run: |
          set -euo pipefail
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts \
            --force-update
          helm repo update
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --version "$KUBE_PROMETHEUS_STACK_VERSION" \
            --namespace monitoring \
            --create-namespace \
            --values cluster-port/monitoring-values.yaml \
            --atomic \
            --timeout 10m

      - name: Verify Prometheus
        run: |
          set -euo pipefail
          kubectl get pods -n monitoring -o wide
          kubectl get services -n monitoring
          curl --retry 12 --retry-delay 5 --retry-connrefused \
            -fsS http://192.168.67.13:30090/-/ready
